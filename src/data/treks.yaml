# Treks shown on /trekking. Order doesn't matter: the page sorts by date.
#
# Quickest way to add one:  npm run trek:add  → paste the Strava embed code,
# press Ctrl+D. It reads title, date and stats from the embed and appends an
# entry here; add note/summit/tags by hand if you like.
#
# By hand: the key becomes the link anchor (/trekking#<key>), so keep it
# lowercase-with-dashes and unique.
#
# <key>:
#   title: Gunung Something via Somewhere   # required
#   date: 2026-11-07                        # required
#   distance: 5.0                           # km
#   elevation: 552                          # elevation gain, m
#   time: 2h 16m                            # as Strava shows it
#   summit: 1929                            # optional, highest point (mdpl)
#   note: Short line about the hike.        # optional
#   tags: [Jawa Barat]                      # optional, used by the filter
#   strava: >-                              # Strava → Share → Embed, pasted as is
#     <div class="strava-embed-placeholder" ...></div><script ...></script>

