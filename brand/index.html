<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand marks</title>
  <style>
    body { margin: 0; font: 14px/1.5 ui-monospace, monospace; color: #171717; background: #fafafa; }
    section { padding: 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
    section.dark { background: #171717; color: #fafafa; }
    figure { margin: 0; display: grid; gap: 8px; justify-items: start; }
    img.tile { height: 96px; } img.word { height: 72px; }
    figcaption { opacity: .6; }
  </style>
</head>
<body>
  <section>
    <figure><img class="tile" src="mark.svg" alt=""><figcaption>mark.svg</figcaption></figure>
    <figure><img class="tile" src="f.svg" alt=""><figcaption>f.svg</figcaption></figure>
    <figure><img class="tile" src="r.svg" alt=""><figcaption>r.svg</figcaption></figure>
    <figure><img class="tile" src="fr.svg" alt=""><figcaption>fr.svg</figcaption></figure>
  </section>
  <section>
    <figure><img class="word" src="feram-wordmark-light.svg" alt=""><figcaption>feram-wordmark-light.svg</figcaption></figure>
    <figure><img class="word" src="feram-prompt-light.svg" alt=""><figcaption>feram-prompt-light.svg</figcaption></figure>
  </section>
  <section class="dark">
    <figure><img class="word" src="feram-wordmark-dark.svg" alt=""><figcaption>feram-wordmark-dark.svg</figcaption></figure>
    <figure><img class="word" src="feram-prompt-dark.svg" alt=""><figcaption>feram-prompt-dark.svg</figcaption></figure>
    <figure><img class="tile" src="fr.svg" alt=""><figcaption>fr.svg on dark</figcaption></figure>
  </section>
</body>
</html>
